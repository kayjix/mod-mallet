# Rules for third-party Rust dependencies, checked by `cargo deny check`
# (part of `cargo xtask ci`). See docs/src/contributing/dependencies.md.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# An ignored advisory needs a reason and should be revisited when the
# dependency that brings it in is updated.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, not vulnerable. It is a build-time macro helper that only Tauri's Linux GTK bindings pull in; nothing to replace it with until Tauri moves off GTK 3." },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list below states what is acceptable, not what is currently in use.
unused-allowed-license = "allow"
# Licenses that may be combined with GPL-3.0-or-later (ADR 0002). Add one
# here only after confirming that it is compatible, and say so in the pull
# request.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # The LOOT libraries still use the old spelling of GPL-3.0-only.
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Two versions of one crate are common in a tree as large as Tauri's and
# harmless. Reporting them would bury the checks that matter.
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates refer to each other by path, without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
